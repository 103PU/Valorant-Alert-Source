name: Official Tag Release

# `git tag v1.0.0 && git push origin v1.0.0` builds, publishes and then verifies.
# workflow_dispatch is a dry run: same build, same checks, archive attached to the
# workflow run, no release created.
#
# What changed here and why — the previous version of this workflow was itself a
# cause of the dead download button. It compressed the release folder into
# `ValorantAlert-${{ github.ref_name }}.zip`, e.g. ValorantAlert-v1.0.0.zip. That
# name ends in .zip but contains no `win-x64`, so KLD's download resolver rejected
# it and returned null for the portable asset. It also shipped no SHA256SUMS.txt,
# which the resolver hands to the client as checksumUrl.
#
# So: the ad-hoc Compress-Archive step is gone — scripts/build.js now produces the
# archive under the name the resolver matches (scripts/release-naming.js), and
# re-adding a second zip step here would reintroduce exactly the old bug.
#
# Two further resolver conditions live on the release rather than the file names and
# are asserted in the last step: the release must be neither a draft nor a
# prerelease, and every asset must reach state === 'uploaded'.
# (Keylicensedashboard/worker/domains/applications/download-resolver.ts:88-101.)

on:
  push:
    tags: [ "v*" ]
  workflow_dispatch:

jobs:
  build-and-release:
    name: Build & Publish Official Release
    runs-on: windows-latest # caxa targets win32 and Compress-Archive is PowerShell

    permissions:
      contents: write # scoped to the job, not the workflow; nothing else is granted

    steps:
      - name: Checkout Source Repository
        uses: actions/checkout@v4

      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      # The artifact naming contract is a unit test (test/release-artifacts.test.js),
      # so the suite gates the build rather than trailing it.
      - name: Run Unit Tests
        run: npm test

      - name: Generate Multi-Format Icons
        run: node scripts/generate-icons.js

      # The tag is what users and KLD's release lookup see; the archive name comes
      # from package.json. If they disagree, tag v1.0.1 ships an asset named
      # ...-v1.0.0-win-x64.zip and nothing surfaces the mismatch until a download.
      # TAG goes through env rather than ${{ }} interpolation into the script body:
      # a tag name is attacker-shaped text and must never be pasted into a shell.
      - name: Assert the tag matches package.json version
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          TAG: ${{ github.ref_name }}
        run: |
          $tag = node -e "process.stdout.write(require('./scripts/release-naming').normalizeVersion(process.env.TAG))"
          $pkg = node -e "process.stdout.write(require('./package.json').version)"
          if ($tag -ne $pkg) {
            throw "Tag $env:TAG normalises to '$tag' but package.json says '$pkg'. Bump the version or retag."
          }
          Write-Host "Tag $env:TAG matches package.json $pkg."

      # Emits dist/ValorantScoreAlert-v<version>-win-x64.zip, the matching
      # ...-installer.zip and SHA256SUMS.txt covering both.
      - name: Build Standalone Executable Release Package
        run: node scripts/build.js

      # build.js guards its own output, but it cannot see a stale dist/ from an
      # earlier version or a checksum file describing a zip rebuilt after it was
      # written. This re-derives all three names, recomputes each digest from the
      # bytes on disk, and exports the paths for the publish step.
      - name: Verify release artifacts
        id: artifacts
        run: node scripts/verify-release-artifacts.js

      # Dispatch runs stop here: the archive rides on the workflow run so it can be
      # smoke-tested on a real machine before anyone cuts a tag.
      - name: Upload archive to the workflow run (dry run)
        if: "!startsWith(github.ref, 'refs/tags/v')"
        uses: actions/upload-artifact@v4
        with:
          name: portable-dry-run
          path: |
            dist/*.zip
            dist/SHA256SUMS.txt
          if-no-files-found: error

      # Was softprops/action-gh-release@v2; swapped for the preinstalled gh CLI to
      # keep a third-party action out of the release path. Same flags: not a draft,
      # not a prerelease, generated notes. --verify-tag refuses to invent a tag.
      - name: Create Official GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
          PORTABLE: ${{ steps.artifacts.outputs.portable }}
          INSTALLER: ${{ steps.artifacts.outputs.installer }}
          CHECKSUMS: ${{ steps.artifacts.outputs.checksums }}
        run: |
          gh release create $env:TAG $env:PORTABLE $env:INSTALLER $env:CHECKSUMS `
            --title "Valorant Score Alert $env:TAG" `
            --generate-notes `
            --verify-tag `
            --latest

      # Asserting the resolver's release-level conditions against what was actually
      # published, not against intent. An asset stuck in 'starter' is still listed by
      # the API but serves nothing, which reads to a user as a corrupt download.
      - name: Verify the published release is resolvable
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          $release = gh api "repos/$env:GITHUB_REPOSITORY/releases/tags/$env:TAG" | ConvertFrom-Json
          if ($release.draft)      { throw "Release $env:TAG is a draft; the resolver skips drafts." }
          if ($release.prerelease) { throw "Release $env:TAG is a prerelease; the resolver skips prereleases." }

          foreach ($a in $release.assets) {
            Write-Host "$($a.name): state=$($a.state) size=$($a.size)"
            if ($a.state -ne 'uploaded') { throw "Asset $($a.name) is '$($a.state)', not 'uploaded'." }
          }

          $portable = $release.assets |
            Where-Object { $_.name -like '*win-x64.zip' -and $_.name -notlike '*installer*' }
          if (-not $portable) { throw "No portable win-x64 .zip asset; the download button would dead-end." }

          # KLD serves recommended = installer ?? portable, so this is the asset most
          # users actually get. Missing, it silently downgrades everyone to portable.
          $installer = $release.assets | Where-Object { $_.name -like '*win-x64-installer.zip' }
          if (-not $installer) { throw "No installer win-x64 .zip asset; KLD would recommend the portable build instead." }

          $sums = $release.assets | Where-Object { $_.name -ieq 'SHA256SUMS.txt' }
          if (-not $sums) { throw "SHA256SUMS.txt is missing; downloads could not be verified." }

          Write-Host "Release $env:TAG is public with $($release.assets.Count) verified asset(s)."

      # Automatically sync the newly published release version and notes to Central KLD Server
      # (Keylicensedashboard) via the secure admin webhook endpoint.
      - name: Publish Release Webhook to Central KLD Server
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          KLD_SERVER_URL: ${{ vars.KLD_SERVER_URL || 'https://keylicensedashboard.dungbd2005.workers.dev' }}
          KLD_ADMIN_TOKEN: ${{ secrets.KLD_ADMIN_TOKEN || secrets.ADMIN_TOKEN }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          if (-not $env:KLD_ADMIN_TOKEN) {
            Write-Host '::notice::KLD_ADMIN_TOKEN is not set — skipping the KLD version webhook.'
            exit 0
          }

          $release = gh api "repos/$env:GITHUB_REPOSITORY/releases/tags/$env:TAG" | ConvertFrom-Json
          if ($release.body) {
            [System.IO.File]::WriteAllText("$PWD/release-notes.txt", $release.body, [System.Text.Encoding]::UTF8)
          }

          node scripts/publish-kld-release.js `
            --tag $env:TAG `
            --url $env:KLD_SERVER_URL `
            --token $env:KLD_ADMIN_TOKEN `
            --notes-file release-notes.txt

          if (Test-Path release-notes.txt) { Remove-Item release-notes.txt -Force }

      # Announcing the release only after the step above proved it resolvable: a notice
      # whose buttons 404 is worse than no notice. Deliberately the last step, so a
      # Discord outage cannot fail a release that is already published and correct.
      #
      # The message goes to a Cloudflare Worker, not to a Discord webhook — the same relay
      # ValorantTweaks uses (notify-discord-bot.yml). A webhook cannot render the link
      # buttons under the embed; only a bot can, and the Worker is what holds the bot
      # token. Both secrets are the user's to add; with CLOUDFLARE_WORKER_URL unset this
      # step skips instead of failing, so the release path works before Discord is wired.
      - name: Notify Discord
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          WORKER_URL: ${{ secrets.CLOUDFLARE_WORKER_URL }}
          AUTH_TOKEN: ${{ secrets.CLOUDFLARE_AUTH_TOKEN }}
          TAG: ${{ github.ref_name }}
          # Where the release actually lives. Today that is this repository; set the
          # RELEASE_REPO variable if publishing ever moves to a separate release repo, and
          # the buttons follow without a code change.
          RELEASE_REPO: ${{ vars.RELEASE_REPO || github.repository }}
        run: |
          if (-not $env:WORKER_URL) {
            Write-Host '::notice::CLOUDFLARE_WORKER_URL is not set — skipping the Discord announcement.'
            exit 0
          }

          # The payload has one definition (scripts/discord-release-notice.js) and is
          # pinned by test/discord-notice.test.js. Written as bytes and POSTed as bytes:
          # the message is Vietnamese plus emoji, and a string round-trip through a shell
          # is how that becomes '?' in the channel.
          node scripts/discord-release-notice.js --tag $env:TAG --repo $env:RELEASE_REPO --out notice.json
          $body = [System.IO.File]::ReadAllBytes("$PWD/notice.json")

          Invoke-RestMethod -Uri $env:WORKER_URL -Method Post -Body $body -Headers @{
            'Content-Type' = 'application/json; charset=utf-8'
            'X-Auth-Token' = $env:AUTH_TOKEN
          } | Out-Null

          Remove-Item notice.json -Force
          Write-Host "Announced $env:TAG to Discord."
