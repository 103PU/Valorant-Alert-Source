name: Official Tag Release

on:
  push:
    tags: [ "v*" ]
  workflow_dispatch:

jobs:
  build-and-release:
    name: Build & Publish Official Release
    runs-on: windows-latest

    permissions:
      contents: write

    steps:
      - name: Checkout Source Repository
        uses: actions/checkout@v4

      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Run Unit Tests
        run: npm test

      - name: Generate Multi-Format Icons
        run: node scripts/generate-icons.js

      - name: Build Standalone Executable Release Package
        run: node scripts/build.js

      - name: Compress Release Package
        run: |
          powershell -Command "Compress-Archive -Path 'dist/ValorantScoreAlert-Release/*' -DestinationPath 'ValorantAlert-${{ github.ref_name }}.zip' -Force"

      - name: Create Official GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: ValorantAlert-${{ github.ref_name }}.zip
          name: Valorant Score Alert ${{ github.ref_name }}
          generate_release_notes: true
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
