name: CI/CD & Automated Release Packaging

on:
  push:
    branches: [ "main", "master" ]
    tags: [ "v*" ]
  workflow_dispatch:

jobs:
  build-and-release:
    name: Build & Package Portable Release
    runs-on: windows-latest

    steps:
      - name: Checkout Source Repository
        uses: actions/checkout@v4

      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Generate Multi-Format Icons
        run: node scripts/generate-icons.js

      - name: Build Portable Release Bundle
        run: node scripts/build.js

      - name: Create ZIP Archive of Release Package
        run: |
          powershell -Command "Compress-Archive -Path 'dist/ValorantScoreAlert-Release/*' -DestinationPath 'Valorant-Score-Alert-Portable-v1.0.0.zip' -Force"

      - name: Upload Release Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Valorant-Score-Alert-Portable
          path: Valorant-Score-Alert-Portable-v1.0.0.zip

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v1
        with:
          files: Valorant-Score-Alert-Portable-v1.0.0.zip
          name: Valorant Score Alert ${{ github.ref_name }}
          body: |
            ## 🎯 Valorant Realtime Score Alert - Release ${{ github.ref_name }}
            
            ### 📌 Hướng dẫn sử dụng:
            1. Tải file `Valorant-Score-Alert-Portable-v1.0.0.zip` và giải nén.
            2. Mở game Valorant trên PC.
            3. Nhấp đôi vào `Start-ValorantAlert.bat` để khởi động PC Dashboard.
            4. Dùng điện thoại quét mã QR để bắt đầu theo dõi tỉ số realtime!
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
