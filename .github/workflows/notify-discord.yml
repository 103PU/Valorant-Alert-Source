name: Discord Notify Bot

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag version để gửi thông báo (ví dụ: v1.0.0)'
        required: true
        default: ''
      repo:
        description: 'Repository chứa release (để trống = RELEASE_REPO hoặc repository hiện tại)'
        required: false
        default: ''

jobs:
  notify:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Notify Discord
        shell: bash
        env:
          WORKER_URL: ${{ secrets.CLOUDFLARE_WORKER_URL }}
          AUTH_TOKEN: ${{ secrets.CLOUDFLARE_AUTH_TOKEN }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ inputs.tag }}
          RELEASE_REPO: ${{ inputs.repo || vars.RELEASE_REPO || github.repository }}
          THIS_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail

          if [ -z "${WORKER_URL}" ]; then
            echo "::error::CLOUDFLARE_WORKER_URL is not set."
            exit 1
          fi

          if [ "${RELEASE_REPO}" = "${THIS_REPO}" ]; then
            gh release view "${TAG}" \
              --repo "${RELEASE_REPO}" \
              --json isDraft,isPrerelease > release.json

            if [ "$(node -p "require('./release.json').isDraft")" != "false" ]; then
              echo "::error::${TAG} is a draft release."
              exit 1
            fi

            if [ "$(node -p "require('./release.json').isPrerelease")" != "false" ]; then
              echo "::error::${TAG} is a prerelease."
              exit 1
            fi

            rm -f release.json
          else
            echo "::warning::Release repository could not be verified."
          fi

          node scripts/discord-release-notice.js \
            --tag "${TAG}" \
            --repo "${RELEASE_REPO}" \
            --out notice.json

          curl --fail --silent --show-error \
            -X POST "${WORKER_URL}" \
            -H 'Content-Type: application/json; charset=utf-8' \
            -H "X-Auth-Token: ${AUTH_TOKEN}" \
            -H 'X-Discord-Route: valorant-alert' \
            --data-binary @notice.json

          rm -f notice.json

          echo "Discord notification sent for ${TAG}."
